on:
  push:
    branches:
      - 'dawio-build-*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pobieranie kodu
        uses: actions/checkout@v4

      - name: Instalacja Javy 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Kompilacja pluginu (Maven)
        run: mvn -B -ntp -f dawio-build/pom.xml package -DskipTests

      - name: Zapisanie pliku .jar
        run: |
          set -e
          JAR=$(find dawio-build/target -maxdepth 1 -name '*.jar' ! -name 'original-*' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)
          if [ -z "$JAR" ]; then echo "Nie znaleziono pliku .jar po kompilacji"; exit 1; fi
          mkdir -p dawio-out
          cp "$JAR" dawio-out/
          git config user.name "dawio-build"
          git config user.email "dawio-build@users.noreply.github.com"
          git add -f dawio-out
          git commit -m "jar"
          git push origin "HEAD:${GITHUB_REF_NAME}"
